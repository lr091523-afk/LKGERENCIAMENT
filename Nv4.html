<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LKGERENCIAMENTO</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.login{min-height:100vh;display:grid;place-items:center;background:#1455a0}.card,.panel,.stat{background:#fff;border-radius:14px;padding:22px;box-shadow:0 5px 20px #0001}.card{width:min(400px,90%)}input{width:100%;padding:11px;margin:7px 0 12px;box-sizing:border-box;border:1px solid #ccd3df;border-radius:9px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.primary{background:#1455a0;color:#fff}.danger{background:#c62828;color:#fff}.success{background:#14804a;color:#fff}.app{display:none}.top{height:64px;background:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.layout{display:flex}.side{width:210px;background:#0b1f3a;min-height:calc(100vh - 64px);padding:12px}.side button{width:100%;text-align:left;background:transparent;color:#fff;margin:3px 0}.main{padding:22px;max-width:1400px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tablebox{background:#fff;overflow:auto;border-radius:12px;margin-top:18px}.table{border-collapse:collapse;width:100%;min-width:850px}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.badge{padding:4px 8px;border-radius:20px}.a{background:#fff0b8}.e{background:#d8f3e3}.r{background:#fde0e0}.muted{color:#667085;font-size:13px}@media(max-width:700px){.side{width:55px}.side span{display:none}.grid,.row{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><div class="card"><h2>LKGERENCIAMENTO</h2><p class=muted>Controle inteligente da sua rede</p><label>E-mail</label><input id=email type=email><label>Senha</label><input id=password type=password><button class="primary" style="width:100%" onclick=login()>ENTRAR</button></div></div><div id=app class=app><header class=top><b>LKGERENCIAMENTO</b><span id=who></span><a href=# onclick=logout()>Sair</a></header><div class=layout><aside class=side><button onclick=page("dash")>📊 <span>Dashboard</span></button><button id=un onclick=page("users")>👥 <span>Subadministradores</span></button><button onclick=page("new")>➕ <span>Novo cadastro</span></button><button onclick=page("records")>📋 <span>Cadastros</span></button><button id=hn onclick=page("history")>🕘 <span>Histórico</span></button></aside><main id=main class=main></main></div></div><script>
let ME;async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});if(!r.ok){let x=await r.json().catch(()=>({}));throw Error(x.message||x.error||"Erro")}return r.headers.get("content-type")?.includes("json")?r.json():r}function esc(s){return String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}async function login(){try{let x=await api("/api/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});ME=x.user;document.getElementById("login").style.display="none";app.style.display="block";who.textContent=ME.name;un.style.display=hn.style.display=ME.role==="ADMIN"?"block":"none";page("dash")}catch(e){alert(e.message)}}async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}function page(p){({dash,users,new:newRec,records,history:hist})[p]()}async function dash(){let x=await api("/api/dashboard");main.innerHTML=`<h1>Dashboard</h1><p class=muted>Visão ${ME.role==="ADMIN"?"geral":"dos seus cadastros"}</p><div class=grid><div class=stat>Total<h2>${x.total}</h2></div><div class=stat>Em análise<h2>${x.pending}</h2></div><div class=stat>Efetivados<h2>${x.effective}</h2></div><div class=stat>${ME.role==="ADMIN"?"Subadministradores":"Rejeitados"}<h2>${ME.role==="ADMIN"?x.subs:x.rejected}</h2></div></div>`}async function users(){let a=await api("/api/users");main.innerHTML=`<h1>Subadministradores</h1><div class=panel><div class=row><div><label>Nome</label><input id=sn></div><div><label>E-mail</label><input id=se></div></div><label>Senha inicial</label><input id=sp type=password><button class=primary onclick=createUser()>CRIAR ACESSO</button></div><div class=tablebox><table class=table><tr><th>Nome</th><th>E-mail</th><th>Cadastros</th><th>Status</th></tr>${a.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.record_count}</td><td><button class="${u.active?"danger":"success"}" onclick="toggle('${u.id}',${!u.active})">${u.active?"Desativar":"Ativar"}</button></td></tr>`).join("")}</table></div>`}async function createUser(){try{let x=await api("/api/users",{method:"POST",body:JSON.stringify({name:sn.value,email:se.value,password:sp.value})});alert("Criado. Link de acesso: "+location.origin+x.access_path);users()}catch(e){alert(e.message)}}async function toggle(id,a){await api("/api/users/"+id+"/active",{method:"PATCH",body:JSON.stringify({active:a})});users()}function newRec(){main.innerHTML=`<h1>Novo cadastro</h1><div class=panel><label>Nome</label><input id=rn><div class=row><div><label>CAD</label><input id=rc></div><div><label>Matrícula</label><input id=rm></div></div><label>Série</label><input id=rs><button class=primary onclick=send()>ENVIAR PARA ANÁLISE</button></div>`}async function send(){try{await api("/api/records",{method:"POST",body:JSON.stringify({name:rn.value,cad:rc.value,matricula:rm.value,serie:rs.value})});alert("Enviado para análise");records()}catch(e){alert(e.message)}}async function records(){let a=await api("/api/records");main.innerHTML=`<h1>Cadastros</h1><div class=tablebox><table class=table><tr><th>Nome</th><th>CAD</th><th>Matrícula</th><th>Série</th><th>Responsável</th><th>Status</th>${ME.role==="ADMIN"?"<th>Ações</th>":""}</tr>${a.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.cad)}</td><td>${esc(r.matricula)}</td><td>${esc(r.serie)}</td><td>${esc(r.owner_name)}</td><td><span class="badge ${r.status==="EM_ANALISE"?"a":r.status==="EFETIVADO"?"e":"r"}">${r.status}</span></td>${ME.role==="ADMIN"?`<td>${r.status==="EM_ANALISE"?`<button class=success onclick="st('${r.id}','EFETIVADO')">Efetivar</button> <button class=danger onclick="st('${r.id}','REJEITADO')">Rejeitar</button>`:"-"}</td>`:""}</tr>`).join("")||"<tr><td>Nenhum cadastro.</td></tr>"}</table></div>`}async function st(id,status){await api("/api/records/"+id+"/status",{method:"PATCH",body:JSON.stringify({status})});records()}async function hist(){let a=await api("/api/history");main.innerHTML=`<h1>Histórico</h1><div class=tablebox><table class=table><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhes</th></tr>${a.map(x=>`<tr><td>${x.created_at}</td><td>${esc(x.actor_name||"-")}</td><td>${esc(x.action)}</td><td>${esc(x.details||"")}</td></tr>`).join("")}</table></div>`}(async()=>{try{let x=await api("/api/me");ME=x.user;document.getElementById("login").style.display="none";app.style.display="block";who.textContent=ME.name;un.style.display=hn.style.display=ME.role==="ADMIN"?"block":"none";page("dash")}catch{}})();
</script></body></html>
