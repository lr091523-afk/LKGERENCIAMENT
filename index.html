<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LKGERENCIAMENTO</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui;background:#f4f7fb;color:#172033}button,input{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#081a31,#1762b6);padding:20px}.card{background:#fff;padding:30px;border-radius:18px;box-shadow:0 20px 70px #0003;width:min(420px,100%)}.logo{font-size:26px;font-weight:900;color:#1455a0}.logo span{color:#0b1f3a}.muted{color:#667085;font-size:13px}label{display:block;font-weight:bold;font-size:13px;margin:16px 0 7px}input{width:100%;padding:12px;border:1px solid #d7dde7;border-radius:10px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:bold}.primary{background:#1455a0;color:#fff}.full{width:100%;margin-top:18px}.danger{background:#c62828;color:#fff}.success{background:#14804a;color:#fff}.app{display:none;min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid #e6ebf1;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.layout{display:flex}.side{width:230px;background:#0b1f3a;min-height:calc(100vh - 68px);padding:14px;color:#dbe8f7}.side button{display:block;width:100%;text-align:left;background:transparent;border:0;color:inherit;padding:12px;border-radius:9px;margin:3px 0}.side button:hover{background:#fff1}.main{max-width:1450px;width:100%;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat,.panel,.tablebox{background:#fff;border:1px solid #e5eaf1;border-radius:14px}.stat{padding:18px}.stat b{font-size:30px;display:block;margin-top:5px}.panel{padding:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.tablebox{overflow:auto}.toolbar{padding:14px;display:flex;justify-content:space-between;gap:10px}.toolbar input{max-width:400px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:12px;border-top:1px solid #eef1f5;text-align:left;font-size:13px}.badge{padding:5px 9px;border-radius:99px;font-weight:bold;font-size:11px}.a{background:#fff0b8}.e{background:#d8f3e3;color:#14643e}.r{background:#fde0e0;color:#9a1c1c}.link{font-size:11px;word-break:break-all;background:#f5f7fa;padding:7px;border-radius:7px}.empty{text-align:center;padding:30px;color:#667085}
@media(max-width:800px){.side{width:64px}.side span{display:none}.grid,.row{grid-template-columns:1fr 1fr}.main{padding:15px}}@media(max-width:560px){.grid,.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><div class="logo">LK<span>GERENCIAMENTO</span></div><p class="muted">Controle inteligente da sua rede</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><button class="btn primary full" onclick="login()">ENTRAR</button></div></div>
<div id="app" class="app"><header class="top"><div class="logo">LK<span>GERENCIAMENTO</span></div><div><b id="who"></b> · <a href="#" onclick="logout()">Sair</a></div></header><div class="layout"><aside class="side"><button onclick="page('dash')">📊 <span>Dashboard</span></button><button id="usersNav" onclick="page('users')">👥 <span>Subadministradores</span></button><button onclick="page('new')">➕ <span>Novo cadastro</span></button><button onclick="page('records')">📋 <span>Cadastros</span></button><button id="histNav" onclick="page('history')">🕘 <span>Histórico</span></button></aside><main id="main" class="main"></main></div></div>
<script>
let ME=null;
async function api(url,opt={}){let r=await fetch(url,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});if(!r.ok){let x=await r.json().catch(()=>({error:"Erro"}));throw new Error(x.message||x.error||"Erro");}return r.headers.get("content-type")?.includes("application/json")?r.json():r}
async function login(){try{let x=await api("/api/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});ME=x.user;show();page("dash")}catch(e){alert(e.message)}}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
function show(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";who.textContent=ME.name;usersNav.style.display=ME.role==="ADMIN"?"block":"none";histNav.style.display=ME.role==="ADMIN"?"block":"none"}
function page(p){if(p==="dash")dash();if(p==="users")users();if(p==="new")newRecord();if(p==="records")records();if(p==="history")historyPage()}
async function dash(){let x=await api("/api/dashboard");main.innerHTML=`<h1>Dashboard</h1><p class="muted">Visão ${ME.role==="ADMIN"?"geral da rede":"dos seus cadastros"}.</p><div class="grid"><div class="stat"><span class="muted">Total</span><b>${x.total}</b></div><div class="stat"><span class="muted">Em análise</span><b>${x.pending}</b></div><div class="stat"><span class="muted">Efetivados</span><b>${x.effective}</b></div><div class="stat"><span class="muted">${ME.role==="ADMIN"?"Subadministradores":"Rejeitados"}</span><b>${ME.role==="ADMIN"?x.subs:x.rejected}</b></div></div><div class="panel"><h2>LKGERENCIAMENTO</h2><p>Cadastros passam por verificação de duplicidade de CAD e matrícula antes de entrar em análise.</p></div>`}
async function users(){let a=await api("/api/users");main.innerHTML=`<h1>Subadministradores</h1><div class="panel" style="max-width:750px;margin:18px 0"><h2>Criar acesso</h2><div class="row"><div><label>Nome</label><input id="sn"></div><div><label>E-mail</label><input id="se"></div></div><label>Senha inicial</label><input id="sp" type="password"><button class="btn primary" style="margin-top:18px" onclick="createUser()">CRIAR SUBADMINISTRADOR</button></div><div class="tablebox"><table class="table"><tr><th>Nome</th><th>E-mail</th><th>Link</th><th>Cadastros</th><th>Status</th></tr>${a.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><div class="link">${esc(location.origin+"/?subadmin="+u.id)}</div></td><td>${u.record_count}</td><td><button class="btn ${u.active?"danger":"success"}" onclick="toggleUser('${u.id}',${!u.active})">${u.active?"Desativar":"Ativar"}</button></td></tr>`).join("")||`<tr><td colspan=5 class=empty>Nenhum subadministrador.</td></tr>`}</table></div>`}
async function createUser(){try{let x=await api("/api/users",{method:"POST",body:JSON.stringify({name:sn.value,email:se.value,password:sp.value})});alert("Criado! Link: "+location.origin+x.access_path);users()}catch(e){alert(e.message)}}
async function toggleUser(id,active){try{await api("/api/users/"+id+"/active",{method:"PATCH",body:JSON.stringify({active})});users()}catch(e){alert(e.message)}}
function newRecord(){main.innerHTML=`<h1>Novo cadastro</h1><p class="muted">CAD e matrícula são únicos em toda a rede.</p><div class="panel" style="max-width:750px;margin-top:18px"><label>NOME</label><input id="rn"><div class="row"><div><label>CAD</label><input id="rc"></div><div><label>MATRÍCULA</label><input id="rm"></div></div><label>SÉRIE</label><input id="ry"><button class="btn primary" style="margin-top:18px" onclick="submitRecord()">ENVIAR PARA ANÁLISE</button></div>`}
async function submitRecord(){try{await api("/api/records",{method:"POST",body:JSON.stringify({name:rn.value,cad:rc.value,matricula:rm.value,serie:ry.value})});alert("Cadastro enviado para análise.");records()}catch(e){alert(e.message)}}
async function records(){let a=await api("/api/records");main.innerHTML=`<h1>Cadastros</h1><div class="toolbar"><input id="q" placeholder="Pesquisar..." oninput="filterRows()">${ME.role==="ADMIN"?'<button class="btn primary" onclick="download()">📥 Excel</button>':""}</div><div class="tablebox"><table class="table"><thead><tr><th>Nome</th><th>CAD</th><th>Matrícula</th><th>Série</th><th>Responsável</th><th>Status</th>${ME.role==="ADMIN"?"<th>Ações</th>":""}</tr></thead><tbody id="rows">${rowHtml(a)}</tbody></table></div>`}
function rowHtml(a){return a.map(r=>`<tr data-s="${esc((r.name+r.cad+r.matricula+r.serie+r.owner_name).toLowerCase())}"><td>${esc(r.name)}</td><td>${esc(r.cad)}</td><td>${esc(r.matricula)}</td><td>${esc(r.serie)}</td><td>${esc(r.owner_name)}</td><td><span class="badge ${r.status==="EM_ANALISE"?"a":r.status==="EFETIVADO"?"e":"r"}">${label(r.status)}</span></td>${ME.role==="ADMIN"?`<td>${r.status==="EM_ANALISE"?`<button class="btn success" onclick="status('${r.id}','EFETIVADO')">Efetivar</button> <button class="btn danger" onclick="status('${r.id}','REJEITADO')">Rejeitar</button>`:"-"}</td>`:""}</tr>`).join("")||`<tr><td colspan=7 class=empty>Nenhum cadastro.</td></tr>`}
function label(s){return s==="EM_ANALISE"?"Em análise":s==="EFETIVADO"?"Efetivado":"Rejeitado"}
function filterRows(){let x=q.value.toLowerCase();document.querySelectorAll("#rows tr[data-s]").forEach(r=>r.style.display=r.dataset.s.includes(x)?"":"none")}
async function status(id,status){try{await api("/api/records/"+id+"/status",{method:"PATCH",body:JSON.stringify({status})});records()}catch(e){alert(e.message)}}
async function historyPage(){let a=await api("/api/history");main.innerHTML=`<h1>Histórico</h1><div class="tablebox" style="margin-top:18px"><table class="table"><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Alvo</th></tr>${a.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.actor_name||"-")}</td><td>${esc(x.action)}</td><td>${esc(x.details||"")}</td></tr>`).join("")||`<tr><td colspan=4 class=empty>Nenhum evento.</td></tr>`}</table></div>`}
function download(){location.href="/api/export.csv"}
function esc(s){return String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}
(async()=>{try{let x=await api("/api/me");ME=x.user;show();page("dash")}catch{}})()
</script>
</body></html>
